<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>夕的手账 · 收件箱</title><link rel="icon" href="dusk-pet.png"><link rel="stylesheet" href="feedback-admin.css?v=1"><script src="lucide.min.js" defer></script><script src="feedback-config.js?v=1" defer></script><script src="feedback.js?v=2" defer></script><script src="feedback-admin.js?v=1" defer></script></head><body><header class="inbox-header"><a href="./" title="返回自用手账"><i data-lucide="arrow-left"></i></a><img src="dusk-pet.png" alt="夕"><h1>手账收件箱</h1><button type="button" id="inboxLogout" title="锁定" aria-label="锁定" hidden><i data-lucide="lock"></i></button></header><main><section id="inboxLogin"><h2>打开收件箱</h2><form id="inboxLoginForm"><label>独立管理凭证<input id="inboxKey" type="password" required autocomplete="off" maxlength="100"></label><button type="submit">打开收件箱</button></form><p>凭证只用于此页，本次打开有效。不是桌宠解锁码。</p></section><section id="inboxView" hidden><div class="inbox-tools"><label>状态<select id="inboxFilter"><option value="all">全部</option><option value="new">待查看</option><option value="working">处理中</option><option value="done">已处理</option></select></label><button type="button" id="inboxRefresh" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button></div><p id="inboxCount"></p><div id="inboxList"></div><button type="button" id="inboxMore" hidden>更早的便签</button></section><p id="inboxStatus" role="status" aria-live="polite"></p></main></body></html>
